<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="https://fonts.googleapis.com/css2?family=Lato&family=Merienda&family=Satisfy&family=Marcellus&family=Montserrat&family=Cinzel:wght@400;600&f" rel="stylesheet">

	<title>Contact</title>

	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="style/common/header.css">
	<link rel="stylesheet" href="style/common/footer.css">
	<link rel="stylesheet" href="style/pages/contact.css">

	<link rel="icon" href="images/Roohani.png">

	<script src="scripts/utils/formValidation.js"></script>
	<script src="scripts/common/header.js" defer></script>
	<script src="scripts/common/footer.js" defer></script>

	<link
		href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
		rel="stylesheet"
	/>
</head>

<body>

<div class="navbar-container"></div>

<div class="contact-container">
	<div class="form-wrapper">
		
		<h2>Get in touch with us!</h2>

		<div class="contact-form-layout">
			<img src="images/tman.png" alt="contact" class="responsive-img">
			<form name="contactForm"  action="https://formspree.io/f/xeokgwbk" method="post" onsubmit="return msgFunction();">
				<div class="form-row">
					<label for="cname">Name:</label>
					<input type="text" id="cname" name="Name" autocomplete="name">
				</div>
				<div class="form-row">
					<label for="cmail">E-mail:</label>
					<input type="text" id="cmail" name="E-mail" autocomplete="email">
				</div>
				<div class="form-row">
					<label for="csubject">You're interested in:</label>
					<input list="subject" id="csubject" name="Subject" autocomplete="off">
					<datalist id="subject">
						<option value="Reservation">
						<option value="Feedback">
						<option value="Suggestion">
						<option value="Query">
						<option value="Collaboration">
						<option value="Others">
					</datalist>
				</div>
				<div class="form-row form-row-textarea">
					<label for="cmsg">Message:</label>
					<textarea id="cmsg" name="Message" rows="10" cols="25" name="message">Type your message here...</textarea>

				</div>
				<button type="submit" id="submit">Submit</button>
			</form>
		</div>
		
		
	</div>

	<div class="sidebar-wrapper">
	
		<div class="contactBox">&#128231 &nbsp  <b>E-mail us at:</b> <br>
				contact@roohani.in </div>
		<div class="contactBox">&#9742 &nbsp <b>Contact us:</b><br>
				7099071378, 7099071379</div>

		<div class="map-box">
			<iframe src="https://www.google.com/maps/embed?
			pb=!1m18!1m12!1m3!1d3581.1882916575105!2d91.77589927447656!3d26.1579965921182!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x375a590041120d8d%3A0x48be0eb638
			cdf978!2sRoohani!5e0!3m2!1sen!2sin!4v1731605496042!5m2!1sen!2sin" style="width:100%; height:100%; border:0;" allowfullscreen="" loading="lazy" 
			referrerpolicy="no-referrer-when-downgrade"></iframe>
		</div>

	</div>
</div>

<div class="footer-container"></div>


</body>
</html>
