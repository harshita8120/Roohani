<h2><center> Get in touch with us! </center></h2>


<form name="contactForm"  action="https://formspree.io/f/xeokgwbk" method="post" onsubit="return msgFunction();">
<table>
	<tr>
	<td rowspan="5"><img src="images/design.png" alt="contact" style="height:500px; width:400px;"></td>
	<td><label for="name"><b>Name:</b></label></td>
	<td><div id="name"><input type="text" id="name" name="Name">
		</div></td>
  </tr>

  <tr>
	<td> <label for="email"><b>E-mail:</b></label></td>
	<td><div id="name"><input type="text" id="email" name="E-mail"> 
		</div></td>
  </tr>

  <tr>
	<td> <p><b> You're interested in: </b></p> </td>
	<td><div id="name"><input list="subject" name="Subject">
	     <datalist id="subject">
	     <option value="Reservation">
	     <option value="Feedback">
	     <option value="Suggestion">
	     <option value="Query">
	     <option value="Collaboration">
	     <option value="Others">
		</div></td>
  </tr>
  
  <tr>
	<td> <label for="msg"><b>Message:</b></label> </td>
	<td> <textarea name="Message" rows="20" cols="25" name="message">Type your message here...</textarea> </td>
  </tr>

  <tr>
	<td colspan="2"> <button type="submit" id="submit">Submit</button></td>
  </tr>

</table>
</form>
