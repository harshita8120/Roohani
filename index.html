<div id="cover-page">
    <div id="collage-wrap">
        <img src="images/20241117_165954_0000.png" alt="Background_Image">
        <div class="quote">
            <p id="quote">"We serve food that touches the <br> soul of our diners."</p>
            <hr>
            <p id="author">- Chef Nayanjyoti Saikia</p>
        </div>
    </div>

    <div id="chef-wrap">
        <picture>
            <source media="(max-width: 768px)" srcset="images/chef-phone-img.jpeg">
            <img src="images/Profile.jpg" alt="Chef Nayan Jyoti">
        </picture>
    </div>
</div>



<h2>Our Services</h2>
<hr><br><br>

<div id="service">
    <div id="service-row">
    </div>
</div>

<br><br>

<!--Feedback-->

<h2>Top Reviews</h2>
<hr><br><br>

<section class="feedback">
	<div class="slider">
		<button class="prev">&#8592</button>
		<div class="slides"></div>
		<button class="next">&#8594</button>
	</div>
</section>
<br><br>


<!-- Desktop reservation — visible on desktop, hidden on mobile -->
<div id="reserve-section">
    <img src="images/Reserve.png" id="reserve-img-desktop" alt="Reserve a Table">
    <form id="reserve" name="resForm" action="https://formspree.io/f/xrbkkzdv" 
          onsubmit="return validateForm(this);" method="post">
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="Name">
        </div>
        <div class="form-row">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="E-mail">
        </div>
        <div class="form-row">
            <label for="date">Date:</label>
            <input type="date" id="date" name="Date">
        </div>
        <div class="form-row">
            <label for="time">Time:</label>
            <input type="time" id="time" name="Time">
        </div>
        <div class="form-row">
            <label>No. of Persons:</label>
            <input type="number" min="1" max="15" name="No. of Persons">
        </div>
        <div class="form-row">
            <label>Any Preferences:</label>
            <input type="text" name="Preferences">
        </div>
        <button id="book" type="submit">Book</button>
    </form>
</div>

<!-- Mobile trigger — hidden on desktop, visible on mobile -->
<div id="reserve-trigger">
    <img src="images/Reserve.png" id="reserve-img" alt="Reserve a Table">
</div>

<div id="reserve-overlay">
    <div id="reserve-drawer">
        <div id="drawer-handle"></div>
        <button id="drawer-close">✕</button>
        <h3>Reserve a Table</h3>
        <form name="resForm2" action="https://formspree.io/f/xrbkkzdv"
              onsubmit="return validateForm(this);" method="post">
            <div class="form-row">
                <label>Name:</label>
                <input type="text" name="Name">
            </div>
            <div class="form-row">
                <label>E-mail:</label>
                <input type="email" name="E-mail">
            </div>
            <div class="form-row">
                <label>Date:</label>
                <input type="date" name="Date">
            </div>
            <div class="form-row">
                <label>Time:</label>
                <input type="time" name="Time">
            </div>
            <div class="form-row">
                <label>Persons:</label>
                <input type="number" min="1" max="15" name="No. of Persons">
            </div>
            <div class="form-row">
                <label>Preferences:</label>
                <input type="text" name="Preferences">
            </div>
            <button id="book-mobile" type="submit">Book</button>
        </form>
    </div>
</div>
